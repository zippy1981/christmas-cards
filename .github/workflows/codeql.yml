name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/codeql.yml"
  pull_request:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Code scanning needs GitHub Advanced Security on private repositories. Run on
    # public repos, or when the GHAS_ENABLED repository variable is "true".
    # (Scheduled runs have no repository payload, so they rely on the variable.)
    if: ${{ (github.event.repository && !github.event.repository.private) || vars.GHAS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow defaults, so repeat contents: read
    # (needed to check out a private repo) alongside what CodeQL itself needs.
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
