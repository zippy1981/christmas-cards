version: 2
updates:
  # Updates the pins in requirements.txt and the ranges in pyproject.toml.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    labels: [dependencies, python]
    # Batch minor/patch bumps into one PR; major bumps still get their own PR.
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    labels: [dependencies, github-actions]
    groups:
      actions:
        patterns: ["*"]
